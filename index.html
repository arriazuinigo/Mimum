<style>
  :root {
    /* ── Type ───────────────────────────────────────────── */
    --font-sans: 'Hanken Grotesk', system-ui, sans-serif;

    /* ── Warm neutrals (background / ink) ───────────────── */
    --canvas:     oklch(95.5% 0.014 165);  /* behind the phone */
    --bg-app:     oklch(98.4% 0.009 158);  /* app screen base  */
    --bg-soft:    oklch(96.6% 0.013 160);  /* recessed wells   */
    --surface:    oklch(99.4% 0.004 120);  /* cards            */
    --surface-2:  oklch(98.0% 0.010 152);  /* tinted cards     */
    --hairline:   oklch(90% 0.012 160);

    --ink:    oklch(31% 0.025 170);  /* primary text   */
    --ink-2:  oklch(48% 0.020 170);  /* secondary      */
    --ink-3:  oklch(64% 0.015 170);  /* tertiary/hint  */

    /* ── Teal (primary brand; kept on old token names for compatibility) ── */
    --blush-50:  oklch(97% 0.018 170);
    --blush-100: oklch(94% 0.035 170);
    --blush-150: oklch(91% 0.050 170);
    --blush-200: oklch(87% 0.070 170);
    --blush-300: oklch(80% 0.090 170);
    --blush-400: oklch(72% 0.112 170);
    --blush-500: oklch(62% 0.118 170);   /* primary */
    --blush-600: oklch(54% 0.118 170);   /* pressed */
    --rose-ink:  oklch(42% 0.095 172);   /* readable teal text */

    /* ── Semantic tiers (muted pastels, never alarming) ── */
    --sage-fill: oklch(94.5% 0.038 152);
    --sage-dot:  oklch(72% 0.080 152);
    --sage-ink:  oklch(46% 0.072 152);

    --honey-fill: oklch(95.5% 0.050 78);
    --honey-dot:  oklch(78% 0.094 78);
    --honey-ink:  oklch(52% 0.090 66);

    --lav-fill: oklch(95% 0.032 295);
    --lav-dot:  oklch(74% 0.062 295);
    --lav-ink:  oklch(52% 0.070 295);

    /* ── Radii & shadow ─────────────────────────────────── */
    --r-card: 28px;
    --r-lg: 32px;
    --r-pill: 999px;
    --sh-soft: 0 2px 6px oklch(58% 0.05 170 / 0.05), 0 12px 30px oklch(58% 0.07 170 / 0.08);
    --sh-lift: 0 4px 10px oklch(58% 0.05 170 / 0.07), 0 18px 44px oklch(58% 0.08 170 / 0.12);
    --sh-btn:  0 6px 16px oklch(62% 0.11 170 / 0.30);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font-sans);
    background:
      radial-gradient(120% 80% at 50% -10%, oklch(97% 0.025 165) 0%, var(--canvas) 60%);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { position: fixed; inset: 0; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  img { user-select: none; -webkit-user-drag: none; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }

  /* hide content until React mounts to avoid flash */
  #root:empty::after {
    content: "";
    position: absolute; inset: 0;
  }

  /* ── Animations ───────────────────────────────────────── */
  @keyframes mascotFloat {
    0%, 100% { transform: translateY(0) rotate(-0.4deg); }
    50%      { transform: translateY(-9px) rotate(0.4deg); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.8); }
    60%  { transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes haloPulse {
    0%   { transform: scale(0.7); opacity: 0.55; }
    70%  { opacity: 0; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  @keyframes softPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.06); opacity: 0.85; }
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-12px) rotate(0deg); opacity: 0; }
    12%  { opacity: 1; }
    100% { transform: translateY(420px) rotate(540deg); opacity: 0; }
  }
  @keyframes shimmer {
    0% { background-position: -120% 0; }
    100% { background-position: 220% 0; }
  }
  @keyframes drawLine {
    from { stroke-dashoffset: var(--dash); }
    to   { stroke-dashoffset: 0; }
  }
  @keyframes bloom {
    0%   { transform: scale(0.4); opacity: 0; }
    60%  { transform: scale(1.12); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes sheetUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .fade-up { animation: fadeUp .5s cubic-bezier(.2,.7,.3,1) both; }
  .pop-in  { animation: popIn .45s cubic-bezier(.2,.8,.3,1) both; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  }
</style>
