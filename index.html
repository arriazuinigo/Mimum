<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mimum — Heart Care, gently</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800&family=Mulish:wght@400;500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet" />
<style>
  :root {
    /* ── Type ───────────────────────────────────────────── */
    --font-sans: 'Hanken Grotesk', system-ui, sans-serif;

    /* ── Warm neutrals (background / ink) ───────────────── */
    --canvas:     oklch(95.5% 0.012 24);   /* behind the phone */
    --bg-app:     oklch(98.4% 0.008 28);   /* app screen base  */
    --bg-soft:    oklch(96.8% 0.012 24);   /* recessed wells   */
    --surface:    oklch(99.6% 0.004 40);   /* cards            */
    --surface-2:  oklch(98.2% 0.010 28);   /* tinted cards     */
    --hairline:   oklch(90% 0.012 24);

    --ink:    oklch(36% 0.022 25);   /* primary text   */
    --ink-2:  oklch(52% 0.018 25);   /* secondary      */
    --ink-3:  oklch(66% 0.014 25);   /* tertiary/hint  */

    /* ── Blush (primary brand) ──────────────────────────── */
    --blush-50:  oklch(97.5% 0.014 18);
    --blush-100: oklch(95% 0.030 18);
    --blush-150: oklch(93% 0.045 18);
    --blush-200: oklch(90% 0.058 18);
    --blush-300: oklch(85% 0.075 18);
    --blush-400: oklch(80% 0.092 18);
    --blush-500: oklch(75% 0.102 18);   /* primary */
    --blush-600: oklch(68% 0.108 18);   /* pressed */
    --rose-ink:  oklch(52% 0.105 18);   /* readable rose text */

    /* ── Semantic tiers (muted pastels, never alarming) ── */
    --sage-fill: oklch(94.5% 0.038 152);
    --sage-dot:  oklch(72% 0.080 152);
    --sage-ink:  oklch(46% 0.072 152);

    --honey-fill: oklch(95.5% 0.050 78);
    --honey-dot:  oklch(78% 0.094 78);
    --honey-ink:  oklch(52% 0.090 66);

    --lav-fill: oklch(95% 0.032 295);
    --lav-dot:  oklch(74% 0.062 295);
    --lav-ink:  oklch(52% 0.070 295);

    /* ── Radii & shadow ─────────────────────────────────── */
    --r-card: 28px;
    --r-lg: 32px;
    --r-pill: 999px;
    --sh-soft: 0 2px 6px oklch(60% 0.06 24 / 0.05), 0 12px 30px oklch(60% 0.08 24 / 0.08);
    --sh-lift: 0 4px 10px oklch(60% 0.06 24 / 0.07), 0 18px 44px oklch(60% 0.09 24 / 0.12);
    --sh-btn:  0 6px 16px oklch(70% 0.11 18 / 0.30);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font-sans);
    background:
      radial-gradient(120% 80% at 50% -10%, oklch(97% 0.02 22) 0%, var(--canvas) 60%);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  #root { position: fixed; inset: 0; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  img { user-select: none; -webkit-user-drag: none; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  * { scrollbar-width: none; }

  /* hide content until React mounts to avoid flash */
  #root:empty::after {
    content: "";
    position: absolute; inset: 0;
  }

  /* ── Animations ───────────────────────────────────────── */
  @keyframes mascotFloat {
    0%, 100% { transform: translateY(0) rotate(-0.4deg); }
    50%      { transform: translateY(-9px) rotate(0.4deg); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn {
    0%   { opacity: 0; transform: scale(0.8); }
    60%  { transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes haloPulse {
    0%   { transform: scale(0.7); opacity: 0.55; }
    70%  { opacity: 0; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  @keyframes softPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.06); opacity: 0.85; }
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-12px) rotate(0deg); opacity: 0; }
    12%  { opacity: 1; }
    100% { transform: translateY(420px) rotate(540deg); opacity: 0; }
  }
  @keyframes shimmer {
    0% { background-position: -120% 0; }
    100% { background-position: 220% 0; }
  }
  @keyframes drawLine {
    from { stroke-dashoffset: var(--dash); }
    to   { stroke-dashoffset: 0; }
  }
  @keyframes bloom {
    0%   { transform: scale(0.4); opacity: 0; }
    60%  { transform: scale(1.12); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes sheetUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  .fade-up { animation: fadeUp .5s cubic-bezier(.2,.7,.3,1) both; }
  .pop-in  { animation: popIn .45s cubic-bezier(.2,.8,.3,1) both; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <!-- reload bust -->

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="ui-core.jsx"></script>
  <script type="text/babel" src="ui-charts.jsx"></script>
  <script type="text/babel" src="screen-home.jsx"></script>
  <script type="text/babel" src="screen-breathe.jsx"></script>
  <script type="text/babel" src="screen-journey.jsx"></script>
  <script type="text/babel" src="screen-trends.jsx"></script>
  <script type="text/babel" src="screen-log.jsx"></script>
  <script type="text/babel" src="screen-handoff.jsx"></script>
  <script type="text/babel" src="screen-onboarding.jsx"></script>
  <script type="text/babel" src="screen-records.jsx"></script>
  <script type="text/babel" src="screen-profile.jsx"></script>
  <script type="text/babel" src="screen-premium.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

</body>
</html>
